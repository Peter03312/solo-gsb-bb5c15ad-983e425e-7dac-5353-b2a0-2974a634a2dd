# 一键启动：docker compose up --build -d
# 服务地址 http://localhost:8080 ，接口文档 http://localhost:8080/docs
services:
  db:
    image: postgres:16-alpine
    container_name: calibration-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-calib}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-calib}
      POSTGRES_DB: ${POSTGRES_DB:-calibration}
      TZ: UTC
    ports:
      # 默认只对内网开放；如需从宿主机直连数据库改为 "5432:5432"
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-calib} -d ${POSTGRES_DB:-calibration}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    container_name: calibration-service
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-calib}:${POSTGRES_PASSWORD:-calib}@db:5432/${POSTGRES_DB:-calibration}
      HOST: 0.0.0.0
      PORT: "8080"
      MAX_CHAIN_DEPTH: ${MAX_CHAIN_DEPTH:-100}
      TX_MAX_ATTEMPTS: ${TX_MAX_ATTEMPTS:-4}
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  pgdata:
